function save(){localStorage.setItem(STORE,JSON.stringify(state));$('#inventoryCount').textContent=state.items.reduce((n,x)=>n+(+x.qty||0),0)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}function bytesToB64(buffer){let s='';new Uint8Array(buffer).forEach(b=>s+=String.fromCharCode(b));return btoa(s)}function b64ToBytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function id(){return crypto.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2))}function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function formatDate(d){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(d)}function money(n,c='USD'){return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(Number(n)||0)}
const dbp=new Promise(resolve=>{if(!indexedDB){resolve(null);return}const q=indexedDB.open(DBNAME,1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('files');d.createObjectStore('keys')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>resolve(null)});function dbReq(store,mode,fn){return dbp.then(db=>new Promise((resolve,reject)=>{if(!db){resolve(null);return}const tx=db.transaction(store,mode),obj=tx.objectStore(store);let req;try{req=fn(obj)}catch(e){reject(e);return}if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}else{tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)}}))}const dbGet=(s,k)=>dbReq(s,'readonly',o=>o.get(k));const dbPut=(s,k,v)=>dbReq(s,'readwrite',o=>o.put(v,k));const dbDel=(s,k)=>dbReq(s,'readwrite',o=>o.delete(k));

function modal(title,body,submitText,onSubmit,eyebrow='PERSONAL HUB'){const dlg=$('#modal');$('#modalTitle').textContent=title;$('#modalEyebrow').textContent=eyebrow;$('#modalBody').innerHTML=body;const acts=$('#modalActions');acts.innerHTML='<button type="button" class="btn subtle" data-close>Cancel</button>'+(submitText?'<button type="submit" class="btn primary">'+esc(submitText)+'</button>':'');$('#modalForm').onsubmit=async e=>{e.preventDefault();try{await onSubmit?.(new FormData(e.currentTarget));dlg.close()}catch(err){toast(err.message||'Could not complete action')}};acts.querySelector('[data-close]').onclick=()=>dlg.close();dlg.showModal()}

function financeView(){const signatures=state.signatures.slice().reverse();return head('PERSONAL FINANCE','Financial desk','Upload a file to your local vault or create a tamper-evident signature for a record.',btn('pick-finance-file','↑ &nbsp; Upload financial data','primary'))+'<div class="data-note">Local signing is a cryptographic integrity feature only. It does not verify your legal identity, create a bank mandate, submit payments, or guarantee legal acceptance. Files and transaction details stay in this browser.</div><div class="two-col" style="margin-top:13px"><div class="card"><div class="cardhead"><h2>Sign a financial record</h2><span class="tag">ECDSA · P-256</span></div><p class="hint">Review the details, then sign them with a non-exportable browser key stored locally.</p><div class="formgrid"><div class="field"><label for="finAmount">Amount</label><input id="finAmount" type="number" step="0.01" min="0" placeholder="0.00"></div><div class="field"><label for="finCurrency">Currency</label><select id="finCurrency"><option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>AUD</option><option>NGN</option><option>ZAR</option><option>INR</option></select></div></div><div class="field"><label for="finRecipient">Payee / counterparty</label><input id="finRecipient" maxlength="120" placeholder="Name or company"></div><div class="field"><label for="finReference">Reference</label><input id="finReference" maxlength="120" placeholder="Invoice, agreement, or record number"></div><div class="field"><label for="finMemo">Description</label><textarea id="finMemo" maxlength="500" placeholder="What does this record represent?"></textarea></div><div class="field"><label for="attachFile">Supporting data (optional)</label><input id="attachFile" type="file" accept=".csv,.json,.pdf,.txt,.xlsx,.docx,image/*"></div><div id="selectedFinanceFile" class="hint">No supporting file selected.</div><button class="btn primary" data-action="review-sign">Review & si function render(){applyStyle();$('#crumbTitle').textContent=views[state.view]||'Overview';$$('.navbtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));const panel=$('#panel');const fn={home:homeView,chat:chatView,calendar:calendarView,camera:cameraView,scan:scanView,inventory:inventoryView,finance:financeView,device:deviceView,files:filesView,appearance:appearanceView};panel.innerHTML=(fn[state.view]||homeView)();save();if(state.view==='scan')checkScannerSupport();if(state.view==='finance')checkKeyStatus();if(state.view==='appearance')enableSettingDrag()}
function navigate(view){stopCamera();stopLocation();state.view=view;render();window.scrollTo({top:0,behavior:'smooth'})}function openAddEvent(date=dateKey(new Date())){modal('Add calendar event','<div class="field"><label>Event</label><input name="title" required maxlength="100" placeholder="Give it a name"></div><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" required value="'+esc(date)+'"></div><div class="field"><label>Time (optional)</label><input name="time" type="time"></div></div><div class="field"><label>Notes</label><textarea name="notes" maxlength="250" placeholder="Add a detail"></textarea></div>','Save event',f=>{state.events.push({id:id(),title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),notes:f.get('notes').trim()});save();render();toast('Event saved on this device')},'CALENDAR')}
function addProduct(name,qty,unit,code){if(!name.trim())throw Error('Enter a product name.');state.items.push({id:id(),name:name.trim(),qty:Math.max(0,Number(qty)||0),unit:(unit||'items').trim(),code:(code||'').trim(),added:Date.now()});save();render();toast('Added to your home inventory')}
async function startCamera(mode){if(!navigator.mediaDevices?.getUserMedia){toast('Camera needs a supported browser and HTTPS.');return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode==='scan'?'environment':'user'}},audio:false});const v=$('#cameraVideo');if(!v){stopCamera();return}v.srcObject=cameraStream;v.hidden=false;const placeholder=$('.camera-placeholder');if(placeholder)placeholder.hidden=true;const controls=$('#cameraControls');if(controls)controls.hidden=false;toast(mode==='scan'?'Scanner camera is on':'Camera is on');if(mode==='scan')scanLoop()}catch(e){toast(e.name==='NotAllowedError'?'Camera permission was denied. Allow it in browser settings.':'Could not open the camera on this device.')}}
function stopCamera(){clearTimeout(scanTimer);if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;const v=$('#cameraVideo');if(v){v.srcObject=null;v.hidden=true}const p=$('.camera-placeholder');if(p)p.hidden=false;const c=$('#cameraControls');if(c)c.hidden=true}
async function checkScannerSupport(){const el=$('#scannerSupport');if(!el)return;if(!('BarcodeDetector'in window)){el.textContent='Camera preview works, but this browser does not expose built-in QR/barcode decoding. You can type the scanned code manually.';return}try{const f=await BarcodeDetector.getSupportedFormats();el.textContent='Supported formats: '+f.filter(x=>['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','data_matrix'].includes(x)).join(', ')+'. Code stays on this device.'}catch{el.textContent='Barcode detection is unavailable. Enter the product code manually.'}}
function parseProductQr(raw){try{const obj=JSON.parse(raw);const name=obj.name||obj.product||obj.item||obj.title;if(name)return{name:String(name),qty:Number(obj.qty||obj.quantity||1),unit:String(obj.unit||'items')}}catch{}try{const u=new URL(raw);const name=u.searchParams.get('name')||u.searchParams.get('product')||u.searchParams.get('item');if(name)return{name,qty:Number(u.searchParams.get('qty')||1),unit:u.searchParams.get('unit')||'items'}}catch{}if(raw.length>0&&raw.length<=64&&!/^\d{8,14}$/.test(raw)&&!/^https?:\/\//i.test(raw))return{name:raw,qty:1,unit:'items'};return null}
async function scanLoop(){if(!cameraStream||state.view!=='scan')return;const v=$('#cameraVideo');try{if(v?.readyState>=2&&'BarcodeDetector'in window){let formats=await BarcodeDetector.getSupportedFormats();formats=formats.filter(x=>['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','data_matrix'].includes(x));if(formats.length){const detector=new BarcodeDetector({formats}),hits=await detector.detect(v);if(hits.length){const code=hits[0].rawValue;stopCamera();const parsed=parseProductQr(code);if(parsed?.name){state.view='inventory';addProduct(parsed.name,parsed.qty||1,parsed.unit||'items',code);toast('QR item added to inventory')}else{navigate('scan');$('#manualCode').value=code;$('#productName').value='Scanned product';toast('Code scanned. Add a name and quantity.')}return}}}}catch{}scanTimer=setTimeout(scanLoop,450)}
async function saveLocalFile(file){if(!(await dbp))throw Error('Local file storage is not supported in this browser.');if(file.size>25*1024*1024)throw Error('Files must be under 25 MB in this prototype.');const raw=await file.arrayBuffer();let hash='';if(crypto?.subtle)hash=bytesToB64(await crypto.subtle.digest('SHA-256',raw));const item={id:id(),name:file.name,size:file.size,type:file.type||'application/octet-stream',added:Date.now(),hash};await dbPut('files',item.id,{meta:item,blob:file});state.files.push(item);save();return item}
async function openDownload(fid){const rec=await dbGet('files',fid);if(!rec?.blob){toast('File is missing from this browser.');return}const url=URL.createObjectURL(rec.blob),a=document.createElement('a');a.href=url;a.download=rec.meta.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function uploadFiles(files){for(const file of files){try{await saveLocalFile(file)}catch(e){toast(e.message)}}if(files.length){toast('Saved '+files.length+' file(s) locally');if(state.view==='files'||state.view==='finance')render()}}
async function getSigningIdentity(){if(!(await dbp))throw Error('This browser cannot save the local signing key. Use a browser with IndexedDB enabled.');let x=await dbGet('keys','signing-identity');if(x)return x;if(!crypto?.subtle||!isSecureContext)throw Error('Local signing requires browser cryptography on HTTPS.');const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);const publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);const pubText=JSON.stringify(publicJwk),fp=bytesToB64(await crypto.subtle.digest('SHA-256',enc.encode(pubText)));x={privateKey:pair.privateKey,publicJwk,fingerprint:fp,created:Date.now()};await dbPut('keys','signing-identity',x);return x}
async function checkKeyStatus(){const el=$('#keyStatus');if(!el)return;const key=await dbGet('keys','signing-identity');el.textContent=key?'Local signing key ready · fingerprint '+key.fingerprint.slice(0,26)+'…':'A non-exportable local signing key is created when you sign. Clearing this browser can permanently remove the key.'}
function collectFinancial(){const amount=$('#finAmount')?.value,currency=$('#finCurrency')?.value,recipient=$('#finRecipient')?.value.trim(),reference=$('#finReference')?.value.trim(),memo=$('#finMemo')?.value.trim();if(!amount||Number(amount)<=0)throw Error('Enter an amount greater than zero.');if(!recipient)throw Error('Enter a payee or counterparty.');return{amount:Number(amount).toFixed(2),currency,recipient,reference,memo}}
async function signFinancial(){const record=collectFinancial(),attachment=pendingFile;if(attachment){const raw=await attachment.arrayBuffer();record.attachment={name:attachment.name,size:attachment.size,sha256:bytesToB64(await crypto.subtle.digest('SHA-256',raw))}}const issued=new Date().toISOString(),payload={schema:'Scott.F.N financial record v1',issued,...record},canonical=JSON.stringify(payload);const key=await getSigningIdentity(),sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key.privateKey,enc.encode(canonical)),digest=bytesToB64(await crypto.subtle.digest('SHA-256',enc.encode(canonical)));const item={id:id(),...payload,canonical,signature:bytesToB64(sig),digest,publicJwk:key.publicJwk,fingerprint:key.fingerprint};state.signatures.push(item);save();pendingFile=null;render();toast('Financial record signed on this device')}
async function verifySignature(s){try{const pub=await crypto.subtle.importKey('jwk',s.publicJwk,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pub,b64ToBytes(s.signature),enc.encode(s.canonical));toast(ok?'Signature verifies for this exact record.':'Signature verification failed.')}catch{toast('Could not verify this local signature.')}}function exportJson(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function stopLocation(){if(geoWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(geoWatch);geoWatch=null;if(locationFix?.live)locationFix={...locationFix,live:false}}
function locateDevice(live=false){if(!navigator.geolocation){toast('Location is unavailable in this browser.');return}const ok=pos=>{locationFix={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy,at:Date.now(),live};if(state.view==='device')render()};const fail=e=>toast(e.code===1?'Location permission denied. Allow it in browser settings.':'Could not get location. Check device location settings.');if(live){geoWatch=navigator.geolocation.watchPosition(ok,fail,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});if(locationFix)locationFix={...locationFix,live:true};toast('Live location enabled for this open page')}else{navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:true,maximumAge:0,timeout:15000});toast('Requesting location permission…')}}
function enableSettingDrag(){const g=$('#settingsGrid');if(!g)return;g.querySelectorAll('.setting-card').forEach(c=>{c.ondragstart=()=>c.classList.add('dragging');c.ondragend=()=>c.classList.remove('dragging')});g.ondragover=e=>e.preventDefault();g.ondrop=e=>{e.preventDefault();const moving=$('.setting-card.dragging'),target=e.target.closest('.setting-card');if(moving&&target&&moving!==target){const a=[...g.children].indexOf(moving),b=[...g.children].indexOf(target);g.insertBefore(moving,a<b?target:target.nextSibling);state.settingOrder=[...g.children].map(x=>x.querySelector('h3').textContent);save()}};if(state.settingOrder){state.settingOrder.forEach(n=>{const c=[...g.children].find(x=>x.querySelector('h3').textContent===n);if(c)g.append(c)})}}
function wireNavDrag(){const rail=$('#railnav');rail.querySelectorAll('.navbtn').forEach(b=>{b.draggable=true;b.ondragstart=()=>{dragMoved=true;b.classList.add('dragging')};b.ondragend=()=>{b.classList.remove('dragging');setTimeout(()=>dragMoved=false,0)}});rail.ondragover=e=>e.preventDefault();rail.ondrop=e=>{e.preventDefault();const moving=$('.navbtn.dragging'),target=e.target.closest('.navbtn');if(moving&&target&&moving!==target){const a=[...rail.children].indexOf(moving),b=[...rail.children].indexOf(target);rail.insertBefore(moving,a<b?target:target.nextSibling);state.navOrder=[...rail.querySelectorAll('.navbtn')].map(x=>x.dataset.view);save()}}}
function init(){applyStyle();wireNavDrag();$('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){if(!dragMoved)navigate(b.dataset.view);return}if(e.target.closest('[data-action=profile]'))toast('Scott.F.N · personal device space')});$('.sidepanel').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='navigate')navigate(b.dataset.view);else if(b.dataset.action==='new-event')openAddEvent();else if(b.dataset.action==='upload-file'){$('#globalFile').accept='*/*';$('#globalFile').click()}});$('.topbar').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='navigate')navigate(b.dataset.view);else if(b.dataset.action==='profile')toast('Scott.F.N · personal device space')});$('#panel').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const [action,arg]=b.dataset.action.split(':');try{switch(action){case'navigate':navigate(arg);break;case'new-event':openAddEvent();break;case'calendar-day':openAddEvent(b.dataset.date);break;case'prev-month':state.month--;if(state.month<0){state.month=11;state.year--}render();break;case'next-month':state.month++;if(state.month>11){state.month=0;state.year++}render();break;case'today':state.month=new Date().getMonth();state.year=new Date().getFullYear();render();break;case'delete-event':state.events=state.events.filter(x=>x.id!==b.dataset.id);render();toast('Event removed');break;case'start-camera':startCamera('camera');break;case'start-scanner':startCamera('scan');break;case'stop-camera':stopCamera();break;case'capture-photo':{const v=$('#cameraVideo'),c=document.createElement('canvas');if(!v?.videoWidth)throw Error('Camera is not ready yet.');c.width=v.videoWidth;c.height=v.videoHeight;c.toBlob(async blob=>{if(blob){try{await saveLocalFile(new File([blob],'SFN-photo-'+Date.now()+'.jpg',{type:'image/jpeg'}));toast('Photo saved to your local file vault')}catch(er){toast(er.message)}}},'image/jpeg',.9);break}case'save-product':addProduct($('#productName').value,$('#productQty').value,$('#productUnit').value,$('#manualCode').value);break;case'add-manual-product':addProduct($('#newProductName').value,$('#newProductQty').value,$('#newProductUnit').value,$('#newProductCode').value);break;case'adjust-qty':{const x=state.items.find(z=>z.id===b.dataset.id);if(x)x.qty=Math.max(0,(+x.qty)+(+b.dataset.delta));render();break}case'delete-product':state.items=state.items.filter(x=>x.id!==b.dataset.id);render();toast('Product removed');break;case'pick-finance-file':$('#globalFile').accept='*/*';$('#globalFile').click();break;case'upload-file':$('#globalFile').accept='*/*';$('#globalFile').click();break;case'wall-upload':$('#globalFile').accept='image/*';$('#globalFile').click();break;case'review-sign':{const r=collectFinancial();modal('Confirm and sign','<div class="data-note">You are signing a local record, not sending a payment.</div><p><strong>'+esc(money(r.amount,r.currency))+'</strong><br>To: '+esc(r.recipient)+'<br>Reference: '+esc(r.reference||'—')+'<br>Details: '+esc(r.memo||'—')+(pendingFile?'<br>Attachment: '+esc(pendingFile.name):'')+'</p><label style="font-size:10px"><input name="confirmed" type="checkbox" required> I reviewed these details and want to sign them on this device.</label>','Sign record',async f=>{if(f.get('confirmed')!=='on')throw Error('Review and confirm the record before signing.');await signFinancial()},'LOCAL SIGNATURE');break}case'verify-signature':{const s=state.signatures.find(x=>x.id===b.dataset.id);if(s)await verifySignature(s);break}case'export-signature':{const s=state.signatures.find(x=>x.id===b.dataset.id);if(s)exportJson(s,'sfn-signed-record-'+s.id+'.json');break}case'locate-device':locateDevice(false);break;case'track-device':locateDevice(true);break;case'refresh-location':locateDevice(false);break;case'stop-location':stopLocation();locationFix=null;render();toast('Location tracking stopped');break;case'download-file':await openDownload(b.dataset.id);break;case'delete-file':await dbDel('files',b.dataset.id);state.files=state.files.filter(x=>x.id!==b.dataset.id);render();toast('File deleted');break;case'send-message':sendMessage();break;case'clear-chat':if(confirm('Clear private notes stored in this browser?')){state.chat=[];render();toast('Notes cleared')}break;case'new-chat':$('#chatInput')?.focus();break;case'profile':toast('Scott.F.N · personal device space');break;case'reset-look':state.wall='aurora';state.wallData=null;state.accent='#65f2c1';state.light=false;state.scale=100;state.navOrder=null;state.settingOrder=null;save();render();toast('Appearance reset');break;case'reset-nav':state.navOrder=null;save();render();wireNavDrag();toast('Navigation reset');break;case'clear-all':if(confirm('Permanently delete local events, messages, inventory, files, and signatures from this browser?')){for(const f of state.files)await dbDel('files',f.id);await dbDel('keys','signing-identity');localStorage.removeItem(STORE);state=loadState();render();toast('Local app data cleared')}break}}catch(err){toast(err.message||'Action could not be completed')}});
$('#panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();sendMessage()}});$('#globalFile').addEventListener('change',async e=>{const files=[...e.target.files||[]];if(!files.length)return;if(e.target.accept==='image/*'){const f=files[0];if(f.size>1024*1024){toast('Choose an image under 1 MB so it fits browser storage');return}const reader=new FileReader();reader.onload=()=>{state.wallData=reader.result;save();applyStyle();toast('Wallpaper saved on this device')};reader.readAsDataURL(f)}else{if(state.view==='finance'&&files[0])pendingFile=files[0];await uploadFiles(files);if(state.view==='finance'&&pendingFile&&$('#selectedFinanceFile'))$('#selectedFinanceFile').textContent='Selected: '+pendingFile.name+' · '+formatBytes(pendingFile.size)}e.target.value='';e.target.accept='*/*'});$('#panel').addEventListener('change',e=>{if(e.target.id==='attachFile'){pendingFile=e.target.files[0]||null;$('#selectedFinanceFile').textContent=pendingFile?'Selected: '+pendingFile.name+' · '+formatBytes(pendingFile.size):'No supporting file selected.'}if(e.target.id==='wallPick'){state.wall=e.target.value;state.wallData=null;save();applyStyle()}if(e.target.id==='accentPick'){state.accent=e.target.value;save();applyStyle()}if(e.target.id==='lightPick'){state.light=e.target.checked;save();applyStyle()}});$('#panel').addEventListener('input',e=>{if(e.target.id==='chatSearch'){const q=e.target.value.toLowerCase();$$('#chatMessages .bubble').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')}if(e.target.id==='scalePick'){state.scale=Number(e.target.value);save();applyStyle()}});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});$('#sideSearch').addEventListener('input',()=>{const q=$('#sideSearch').value.trim();if(q){navigate('chat');const search=$('#chatSearch');if(search){search.value=q;search.dispatchEvent(new Event('input',{bubbles:true}))}toast('Filtered your local notes')} });$('#connectionChip').onclick=()=>toast(navigator.onLine?'Internet available · no account sync is configured':'Offline mode · local features are ready');$('#connectionChip').style.cursor='pointer';$('#inventoryCount').textContent=state.items.reduce((n,x)=>n+(+x.qty||0),0);render()}
function sendMessage(){const input=$('#chatInput'),text=input?.value.trim();if(!text)return;state.chat.push({id:id(),text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});save();render();$('#chatMessages')?.scrollTo({top:$('#chatMessages').scrollHeight,behavior:'smooth'})}
